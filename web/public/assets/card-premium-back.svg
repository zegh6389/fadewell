    </g>
    <text x="56" y="310" font-size="19" font-weight="700">Know your state requirements.</text>
    <g font-size="17">
      <text x="56" y="340">Possession limits, approved products, and patient rules vary by state.</text>
      <text x="56" y="365">Follow your clinician’s guidance and your state medical cannabis program.</text>
