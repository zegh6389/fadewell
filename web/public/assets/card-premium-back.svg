    <text x="56" y="164" font-size="17" font-weight="700" letter-spacing="3">PATIENT INFORMATION</text>
    <text x="56" y="211" font-size="19" font-weight="700">Safety first.</text>
    <g font-size="17">
      <text x="56" y="241">Cannabis may impair attention and coordination. Do not drive or operate</text>
